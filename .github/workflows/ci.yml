name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ci                      # local tag used inside the pipeline
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. lint-test-python  — Python linting (+ unit tests, Task 4.3)
  # ──────────────────────────────────────────────────────────────
  lint-test-python:
    name: lint-test-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs-service/requirements.txt

      - name: Install dependencies
        working-directory: jobs-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: flake8 — hard errors (syntax / undefined names)
        working-directory: jobs-service
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: flake8 — style
        working-directory: jobs-service
        run: flake8 app --count --max-line-length=120 --max-complexity=12 --statistics

      - name: pytest
        working-directory: jobs-service
        env:
          PYTHONPATH: .
        run: |
          if [ -d tests ]; then
            pytest -v --junitxml=pytest-report.xml
          else
            echo "::warning::No tests/ directory yet — add jobs-service/tests/test_main.py (Task 4.3)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: jobs-service/pytest-report.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # 2. lint-test-node — dependency audit for both JS packages
  # ──────────────────────────────────────────────────────────────
  lint-test-node:
    name: lint-test-node (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [applications-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci || npm install

      - name: npm audit (production deps, fail on HIGH+)
        working-directory: ${{ matrix.service }}
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (full report, informational)
        working-directory: ${{ matrix.service }}
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-${{ matrix.service }}.json || true
          npm audit || true

      - name: Lint (if a lint script exists)
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-${{ matrix.service }}
          path: ${{ matrix.service }}/npm-audit-${{ matrix.service }}.json
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # 3. build-images — all 4 images, exported as artifacts
  # ──────────────────────────────────────────────────────────────
  build-images:
    name: build-images (${{ matrix.service }})
    needs: [lint-test-python, lint-test-node]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [jobs-service, applications-service, frontend, nginx]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Show image size
        run: docker images jobboard-${{ matrix.service }} --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Export image to tar
        run: docker save jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }} -o /tmp/${{ matrix.service }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # 4. scan-images — Trivy, exit-code 0 + JSON/SARIF reports
  # ──────────────────────────────────────────────────────────────
  scan-images:
    name: scan-images (${{ matrix.service }})
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [jobs-service, applications-service, frontend, nginx]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ matrix.service }}.tar

      - name: Trivy scan — table output in the log
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          scan-ref: .
          image-ref: jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: table
          severity: ${{ env.TRIVY_SEVERITY }}
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"            # report only — the stage must go green

      - name: Trivy scan — JSON report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          scan-ref: .
          image-ref: jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"

      - name: Trivy scan — SARIF (GitHub Security tab)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          scan-ref: .
          image-ref: jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: CVE counts (paste into SOLUTION.md)
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-${{ matrix.service }}.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' trivy-${{ matrix.service }}.json)
          echo "### ${{ matrix.service }}: $CRIT CRITICAL / $HIGH HIGH" >> "$GITHUB_STEP_SUMMARY"
          jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")
                  | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"]
                 | unique | .[]' trivy-${{ matrix.service }}.json >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.json
            trivy-${{ matrix.service }}.sarif
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 5. integration-test — run the real stack, assert the API
  # ──────────────────────────────────────────────────────────────
  integration-test:
    name: integration-test
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images

      - name: Load all images
        run: |
          for tar in /tmp/images/*.tar; do docker load -i "$tar"; done
          docker images

      - name: Create .env for the stack
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=jobboard
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=CiTestP@ssw0rd!2026
          NGINX_PORT=8080
          EOF

      - name: Start the stack (pre-built images, no rebuild)
        run: docker compose -f docker-compose.yml up -d 

      - name: Wait for containers to become healthy
        run: |
          for i in $(seq 1 40); do
            docker compose ps
            if ! docker compose ps --format '{{.Health}}' | grep -qE 'starting|unhealthy'; then
              echo "All containers settled."; break
            fi
            sleep 5
          done
          docker compose ps

      - name: Run API assertions
        env:
          BASE_URL: http://localhost:8080
        run: bash .github/workflows/integration-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────────────────────
  # 6. push-to-registry — main branch only, pushes tested images
  # ──────────────────────────────────────────────────────────────
  push-to-registry:
    name: push-to-registry (${{ matrix.service }})
    needs: [scan-images, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [jobs-service, applications-service, frontend, nginx]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ matrix.service }}.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/jobboard-${{ matrix.service }}"
          docker tag jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }} "$REPO:latest"
          docker tag jobboard-${{ matrix.service }}:${{ env.IMAGE_TAG }} "$REPO:${GITHUB_SHA::7}"
          docker push "$REPO:latest"
          docker push "$REPO:${GITHUB_SHA::7}"
          echo "Pushed $REPO:latest and $REPO:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
